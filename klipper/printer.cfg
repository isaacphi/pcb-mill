# Snapmaker Original CNC Configuration
# Based on UlinProject pin mappings

[mcu]
# Snapmaker CH340 on the OctoPi (stable by-id; CH340s have no unique serial,
# so don't plug in a second CH340 device). Stock firmware talks 115200,
# Klipper build is 250000 (matches firmware/ binary).
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000  # must match the flashed firmware build (firmware/README.md)
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3600
max_z_velocity: 20
max_z_accel: 450
square_corner_velocity: 8.0

# X-axis (channel 1 on Snapmaker board)
[stepper_x]
step_pin: PB5
dir_pin: !PB6
enable_pin: !PB7
microsteps: 16
rotation_distance: 8
endstop_pin: ^!PC11
position_endstop: -4
position_min: -4
position_max: 120
homing_speed: 12

# Y-axis (channel 2)
[stepper_y]
step_pin: PB8
dir_pin: !PB9
enable_pin: !PB4
microsteps: 16
rotation_distance: 8
endstop_pin: ^!PC10
position_endstop: -4
position_min: -4
position_max: 120
homing_speed: 12

# Z-axis (channel 3)
[stepper_z]
step_pin: PB3
dir_pin: !PD2
enable_pin: !PC12
microsteps: 16
rotation_distance: 8
endstop_pin: ^!PA8
position_endstop: -0.5   # never used (Z is not homed); keep inside min..max
position_min: -0.5      # PROBE floor: copper is Z0, so a dead probe can go at most 0.5 mm into the board
position_max: 125.5
homing_speed: 9

# Spindle control - on/off via relay (switches 48V supply mains input, see doc 3.1)
[output_pin spindle]
# TOOLHEAD HEATER output (active-low per UlinProject + cratchat heater configs).
# On this unit the hotend header is unused in CNC mode (self-contained 48V
# spindle), so the relay tap is a pluggable lead on header pin 1 (+24V
# permanent) / pin 3 (switched return) + 1N4007 across the coil.
# Meter-verified on this machine. Spare: bed-heater output PA7 (bed connector
# pins 1/3, also verified) if the header is ever needed for a toolhead module.
pin: !PB10
value: 0
shutdown_value: 0
pwm: False
value: 0
shutdown_value: 0

# Optional: spindle speed PWM (if you add PWM-to-voltage converter).
# NOTE: !PB10 is the spindle relay pin; PWM speed would use the spare bed
# heater output PA7 (also meter-verified) or replace the relay with a MOSFET.
# [output_pin spindle_speed]
# pin: PA7
# pwm: True
# cycle_time: 0.001  # 1kHz PWM
# value: 0

# Electrical touch probe - bit-to-copper contact on the door-switch input
# (enclosure port, brain channel 5, endstop pin PC0). Clip 1: bit shank ->
# signal, clip 2: copper pour -> GND. Keep the door switch OUT of circuit
# (input must read OPEN unless the bit touches copper). 1k series resistor
# + 100nF cap at the module end. Spindle OFF while probing; REMOVE clips
# before M3!
[probe]
pin: ^!PC0
z_offset: 0       # the bit tip IS the probe - no tip offset
speed: 3          # mm/s, slow for reliable contact (2 verified; 3 still safe)
samples: 2        # tolerance stops early anyway; contact repeatability is ~0.01mm
samples_result: median
sample_retract_dist: 1.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
lift_speed: 8     # retracts faster than probe speed; big time saver on large meshes

# Surface height map of the PCB. Isolation cut_depth is only 0.2 mm while
# board bow + clamp tilt is easily +-0.1-0.3 mm, so this is what makes
# isolation depth consistent. Probe fresh copper BEFORE milling (after
# isolation the copper has gaps and continuity is lost).
[bed_mesh]
speed: 120
horizontal_move_z: 1.5   # shorter descend per point; still clears clamps on the region
mesh_min: 5,5         # keep probe points inside the copper and clear of
mesh_max: 105,105     # pre-drilled holes/slots (or add faulty_region_*)
probe_count: 7,7
algorithm: bicubic

# Arc resolution - key for smooth circles!
[gcode_arcs]
resolution: 0.5  # mm max segment length (default 1.0)
# Lower = smoother circles, but more segments

# Optional: input shaping for reduced vibration
# [input_shaper]
# shaper_freq_x: 20
# shaper_freq_y: 40
# shaper_type_x: mzv
# shaper_type_y: mzv

# Datums persisted so a restart doesn't lose "where we are". Only the XY ones
# are physically meaningful across a power cycle - see the homing notes below.
#   board_x/board_y   XY of the board's 0,0 corner (SET_BOARD_ORIGIN). REAL:
#                     X/Y homing is a real endstop, so this survives restarts.
#   copper_z          Z of the copper in the current fake Z frame. DIAGNOSTIC
#                     ONLY - never used to command motion.
#   lift_mm / park_z  start-up lift distance and the Z value stamped after it.
[save_variables]
filename: /home/site3/printer_data/config/variables.cfg

# Homing. Each linear rail has ONE microswitch at ONE end only: X/Y at the min
# end, Z at the BOTTOM OF THE COLUMN. So Z CANNOT be endstop-homed on this
# machine: homing Z means driving the carriage - and the bit - down past the
# bed, through the workpiece. That is not a config bug to work around, it is
# the machine. Z therefore has NO repeatable datum across power cycles; the
# only true Z zero is the copper surface, found by the probe in PCB_MESH.
#
# What start-up does instead (every G28 variant, axes: xyz, so G28, G28 X,
# G28 Z and Fluidd's home buttons all come through here):
#   1. clear the XY g-code offset so the parking moves are MACHINE XY
#   2. lift Z lift_mm (relative if Z is homed, blind FORCE_MOVE if it isn't),
#      so every later XY move happens at height, never dragging the bit
#   3. home X, then Y - real switches, repeatable to the switch, so the stored
#      board origin stays valid after a restart
#   4. stamp the Z axis as park_z (default 25) with SET_KINEMATIC_POSITION.
#      That is a LABEL, not a home: it just gives Z a frame to move in and
#      ~28mm of travel below it. NEVER G28 Z.
#   5. move XY to the stored board corner and G92 X/Y 0, so job coordinates
#      line up with the G-code (which is zero-based at the board corner)
#
# Z=0 on the copper still comes from PCB_MESH's probe - per session, always.
# `MILL_STATUS` prints the whole state at any time.
[homing_override]
axes: xyz
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set lift = sv.get('lift_mm', 10.0)|float %}
  {% set park_z = sv.get('park_z', 25.0)|float %}
  G90
  SET_GCODE_OFFSET X=0 Y=0
  {% if 'z' in printer.toolhead.homed_axes %}
    G91
    G1 Z{lift} F600
    G90
  {% else %}
    FORCE_MOVE STEPPER=stepper_z DISTANCE={lift} VELOCITY=5
  {% endif %}
  G28 X
  G28 Y
  SET_KINEMATIC_POSITION Z={park_z} SET_HOMED=Z
  {% if 'board_x' in sv %}
    G0 X{sv.board_x|float} Y{sv.board_y|float} F3000
    G92 X0 Y0
    {action_respond_info("Homed X/Y on switches; Z stamped %.1f (label only - Z is never endstop-homed). At board origin: gcode 0,0. Z=0 on the copper comes from PCB_MESH."|format(park_z))}
  {% else %}
    G0 X0 Y0 F3000
    {action_respond_info("Homed X/Y on switches; Z stamped %.1f (label only). No board origin saved - jog to the board corner and run SET_BOARD_ORIGIN."|format(park_z))}
  {% endif %}

# LED control (if you want status lights)
[output_pin LED_R]
pin: PC7
value: 0

[output_pin LED_B]
pin: PC8
value: 0

[output_pin GATE_CTRL]
pin: PB0
value: 1

[output_pin MAIN_POWER]
pin: PF2
value: 1

[output_pin STEPPER_POWER]
pin: PF1
value: 1

# Idle timeout - do NOT disable steppers: M84 clears Klipper's homed state
# (v0.12+) and has repeatedly broken interactive CNC sessions. Keep motors
# engaged; just nag. Steppers staying warm is fine.
[idle_timeout]
timeout: 3600
gcode:
  {action_respond_info("Idle 1h - steppers still engaged, homing kept")}

[virtual_sdcard]
path: /home/site3/printer_data/gcodes  # OctoPi user is site3

[force_move]
enable_force_move: 1

# Pause/resume for tool changes
[pause_resume]

# Display status
[display_status]

# Macros for CNC workflow
[gcode_macro M3]
description: Spindle on
gcode:
  SET_PIN PIN=spindle VALUE=1
  G4 P1000  # Wait 1s for spin-up

[gcode_macro M5]
description: Spindle off
gcode:
  SET_PIN PIN=spindle VALUE=0
  G4 P1000  # Wait 1s for spin-down

[gcode_macro CNC_START]
description: Home (deterministic: lift, XY, park clear, Z down) and start job
gcode:
  G28  ; full startup sequence, see [homing_override]
  G90  ; Absolute positioning
  G21  ; Millimeters

[gcode_macro CNC_END]
description: Safe park after job (spindle off, lift, board origin). Keeps homing.
gcode:
  M5   ; Spindle off
  G91
  G1 Z10 F3000  ; raise 10mm above the cut, relative so it works in job coords
  G90
  G0 X0 Y0 F3000  ; back to the board origin (gcode 0,0)
  ; deliberately NO M84: disabling steppers clears Klipper's homed state

# ---- where are we? -------------------------------------------------------
[gcode_macro MILL_STATUS]
description: Report machine position, homed axes, saved datums and offsets
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set p = printer.toolhead.position %}
  {% set g = printer.gcode_move.gcode_position %}
  {% set o = printer.gcode_move.homing_origin %}
  {action_respond_info("homed=[%s] machine XYZ = %.2f, %.2f, %.2f | gcode XYZ = %.2f, %.2f, %.2f | offset XYZ = %.2f, %.2f, %.2f"|format(printer.toolhead.homed_axes, p[0], p[1], p[2], g[0], g[1], g[2], o[0], o[1], o[2]))}
  {action_respond_info("datums: board origin = %s,%s (real) | copper_z = %s (diagnostic) | lift = %s | park_z = %s"|format(sv.get('board_x', 'unset'), sv.get('board_y', 'unset'), sv.get('copper_z', 'unset'), sv.get('lift_mm', 10.0), sv.get('park_z', 25.0)))}
  {action_respond_info("probe: %s | mesh: %s | Z has no repeatable datum: Z=0 comes from PCB_MESH every session"|format(printer.probe.last_query, printer.bed_mesh.profile_name or 'none'))}

# ---- datum capture -------------------------------------------------------
[gcode_macro SET_BOARD_ORIGIN]
description: Record the bit's current XY as the board's 0,0 corner (persisted)
gcode:
  {% set p = printer.toolhead.position %}
  SAVE_VARIABLE VARIABLE=board_x VALUE={p[0]}
  SAVE_VARIABLE VARIABLE=board_y VALUE={p[1]}
  G92 X0 Y0
  {action_respond_info("Board origin saved: machine X%.2f Y%.2f is now gcode 0,0 (survives restarts; G28 returns here)"|format(p[0], p[1]))}

# Z has no repeatable datum (see [homing_override]), so copper_z is recorded
# for diagnostics only - it tells you whether the frame has drifted between
# sessions and sanity-checks the probe numbers. It never commands motion.
[gcode_macro SET_COPPER_Z]
description: Record current Z as the copper surface (diagnostic only)
gcode:
  {% set z = printer.toolhead.position[2] %}
  SAVE_VARIABLE VARIABLE=copper_z VALUE={z}
  {action_respond_info("Copper Z in this frame = %.2f (diagnostic; Z is re-zeroed by PCB_MESH every session)"|format(z))}

[gcode_macro SET_STARTUP_LIFT]
description: Blind lift applied before any XY move at home (mm). Default 10.
gcode:
  {% set v = params.MM|default(10)|float %}
  SAVE_VARIABLE VARIABLE=lift_mm VALUE={v}
  {action_respond_info("Start-up lift set to %s mm"|format(v))}

[gcode_macro SET_PARK_Z]
description: Z value stamped on the axis after the start-up lift. Default 25.
gcode:
  {% set v = params.Z|default(25)|float %}
  SAVE_VARIABLE VARIABLE=park_z VALUE={v}
  {action_respond_info("Start-up Z label set to %s (a label, not a homing position)"|format(v))}

# Get out of a tangle mid-session without homing anything.
[gcode_macro MILL_LIFT]
description: Lift Z by lift_mm, then XY to the board origin (gcode 0,0)
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set lift = sv.get('lift_mm', 10.0)|float %}
  {% if 'z' in printer.toolhead.homed_axes %}
    G91
    G1 Z{lift} F600
    G90
    G0 X0 Y0 F3000
    {action_respond_info("Lifted %s mm; at board origin 0,0"|format(lift))}
  {% else %}
    {action_respond_info("Z is not homed/labelled - run G28 first")}
  {% endif %}

# ---------------------------------------------------------------------------
# COPPER PROBING.  Run after G28, probe clips ON, spindle OFF.
#
# Z has no home, so the machine Z "label" is arbitrary. Klipper's probe always
# descends to stepper_z position_min (-0.5 label) if nothing triggers, so we
# MOVE THE LABEL to decide how far a dead probe can go:
#
#       max descent = label_now + 0.5
#
# Frame used once the copper is found: copper surface := Z 0, i.e. the
# floor (-0.5) is only 0.5 mm below copper (survivable for a 0.8 mm bit
# on a flat board).  Mesh values are absolute in this frame, so nothing is
# relabelled afterwards and G-code Z0 == copper everywhere the mesh is active.
#
#  1. PCB_DATUM      jog the bit to ~1-3 mm over copper, then run it. It
#                    searches down DEPTH mm (default 3) at a time; if nothing
#                    touches, the bit is still above copper - just run again.
#  2. PCB_MESH X0 Y0 X1 Y1   mesh the region (inside the copper!), travelling
#                    CLEAR mm (default 1.5) above the datum plane.
# ---------------------------------------------------------------------------
[gcode_macro PCB_DATUM]
description: Find the copper under the bit; copper := Z0. Optional DEPTH=3, DRY=1 to only print the plan
variable_done: 0
gcode:
  {% set depth = params.DEPTH|default(3.0)|float %}
  {% set start = -0.5 + depth %}
  {% if 'z' not in printer.toolhead.homed_axes %}
    {action_raise_error("PCB_DATUM: run G28 first")}
  {% endif %}
  {% if depth > 4.0 or depth <= 0 %}
    {action_raise_error("PCB_DATUM: DEPTH must be 0..4 mm")}
  {% endif %}
  {action_respond_info("PCB_DATUM plan: relabel Z %.3f -> %.3f, probe may descend at most %.2f mm (floor label -0.5)"|format(printer.toolhead.position[2], start, depth))}
  {% if params.DRY|default(0)|int == 0 %}
    SET_GCODE_VARIABLE MACRO=PCB_DATUM VARIABLE=done VALUE=0
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0
    G90
    SET_KINEMATIC_POSITION Z={start}
    PROBE SAMPLES=1
    _PCB_DATUM_DONE
  {% endif %}

# The bit is sitting on the copper when this runs. Relabel to 0, then lift
# with a RELATIVE move (no absolute Z move straight after a relabel).
[gcode_macro _PCB_DATUM_DONE]
gcode:
  SET_KINEMATIC_POSITION Z=0
  SET_GCODE_VARIABLE MACRO=PCB_DATUM VARIABLE=done VALUE=1
  G91
  G1 Z1.5 F300
  G90
  {action_respond_info("Datum OK: copper = Z0, floor = 0.5 mm below. Bit lifted 1.5 mm. Now PCB_MESH X0 Y0 X1 Y1.")}

[gcode_macro PCB_MESH]
description: Mesh the copper after PCB_DATUM. REQUIRES X0 Y0 X1 Y1 (inside copper). Optional PTSX PTSY CLEAR MAX_SPREAD
gcode:
  {% if params.X0 is not defined or params.Y0 is not defined or params.X1 is not defined or params.Y1 is not defined %}
    {action_raise_error("PCB_MESH: pass X0 Y0 X1 Y1 (machine mm), fully inside the copper")}
  {% endif %}
  {% if not printer["gcode_macro PCB_DATUM"].done %}
    {action_raise_error("PCB_MESH: run PCB_DATUM first")}
  {% endif %}
  {% set x0 = params.X0|float %}
  {% set y0 = params.Y0|float %}
  {% set x1 = params.X1|float %}
  {% set y1 = params.Y1|float %}
  {% set px = params.PTSX|default(params.PTS|default(3))|int %}
  {% set py = params.PTSY|default(params.PTS|default(3))|int %}
  {% set clear = params.CLEAR|default(1.5)|float %}
  {% set hfz = clear %}
  G90
  SET_GCODE_OFFSET Z=0
  G0 Z{hfz} F300
  BED_MESH_CALIBRATE MESH_MIN={x0},{y0} MESH_MAX={x1},{y1} PROBE_COUNT={px},{py} HORIZONTAL_MOVE_Z={hfz} ALGORITHM=lagrange
  _PCB_FINISH MAX_SPREAD={params.MAX_SPREAD|default(0.4)}

[gcode_macro _PCB_FINISH]
gcode:
  {% set max_spread = params.MAX_SPREAD|default(0.4)|float %}
  {% set pm = printer.bed_mesh.probed_matrix %}
  {% set ns = namespace(lo=999.0, hi=-999.0) %}
  {% for row in pm %}{% for v in row %}
    {% set ns.lo = [ns.lo, v]|min %}
    {% set ns.hi = [ns.hi, v]|max %}
  {% endfor %}{% endfor %}
  {% set spread = ns.hi - ns.lo %}
  {% if spread > max_spread %}
    BED_MESH_CLEAR
    G0 Z1.5 F300
    {action_respond_info("MESH REJECTED: spread %.3f mm (limit %.2f), range %.3f..%.3f. Re-clamp flatter or shim. Mesh cleared, gcode Z0 is the datum plane only (Z0 = datum plane at the datum point only)."|format(spread, max_spread, ns.lo, ns.hi))}
  {% else %}
    G0 Z1.5 F300
    {action_respond_info("Mesh OK: spread %.3f mm, range %.3f..%.3f (expect ~0). REMOVE PROBE CLIPS before M3."|format(spread, ns.lo, ns.hi))}
  {% endif %}

# gerber2gcode emits GRBL-isms that Klipper doesn't know - shim them so a
# job doesn't die on "Unknown command" mid-file:
[gcode_macro G94]
description: GRBL feed-rate-mode no-op (Klipper is always mm/min)
gcode:

[gcode_macro M0]
description: GRBL unconditional pause
gcode:
  PAUSE

[gcode_macro M2]
description: GRBL program end
gcode:
  CNC_END

[gcode_macro M30]
# Klipper's [virtual_sdcard] registers its own M30 (file delete); take the
# name back for the GRBL-style program-end shim.
rename_existing: M30.1
description: GRBL program end
gcode:
  CNC_END
