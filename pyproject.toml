[project]
name = "pcb-mill"
version = "0.1.0"
description = "Gerber/Excellon (or KiCad board) -> GRBL G-code for PCB isolation milling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pillow>=10.0",
    "pygerber==2.4.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "scikit-image>=0.24",
    "scipy>=1.13",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# test_hardware.py / monitor_probe.py are interactive bench tools (live machine,
# stdin prompts), not unit tests — only collect the real suite.
testpaths = ["tests"]
